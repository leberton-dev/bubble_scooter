[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.basedpyright]
reportUnusedCallResult = false

[project]
name = "bubble-scooter"
version = "0.2.0"
description = "A bubble shooter creater for my mum"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygame>=2.6.1",
]

[project.scripts]
bubble = "main:main"
